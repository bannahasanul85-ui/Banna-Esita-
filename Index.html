<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banna &amp; Esita — Private Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#160f22;
    --bg-1:#1e1530;
    --panel:#251b39;
    --panel-soft:#2c2044;
    --gold:#d1974a;
    --gold-soft:#b17d3a;
    --rose:#a4384a;
    --thread:#3a6b5c;
    --ivory:#f2e9d8;
    --ivory-dim:#c3b8d6;
    --line: rgba(209,151,74,0.32);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 0%, rgba(209,151,74,0.10), transparent 45%),
      radial-gradient(circle at 92% 15%, rgba(164,56,74,0.12), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(58,107,92,0.10), transparent 45%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--ivory);
    font-family:'Noto Serif Bengali', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:0 0 60px;
    position:relative;
  }
  .eng{font-family:'Cormorant Garamond', serif; letter-spacing:0.04em;}
  .hidden{display:none !important;}

  .topbar{
    display:flex; align-items:center; justify-content:center;
    padding:22px 20px 14px;
    position:relative;
  }
  .brand{
    font-size:15px; color:var(--gold); letter-spacing:0.18em;
    font-style:italic;
  }
  .backbtn{
    position:absolute; left:16px; top:18px;
    background:transparent; border:1px solid var(--line);
    color:var(--ivory-dim); border-radius:999px;
    padding:6px 14px; font-size:14px; cursor:pointer;
    font-family:'Noto Serif Bengali', serif;
  }
  .backbtn:hover{border-color:var(--gold); color:var(--gold);}

  .ornament{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin:6px auto 24px; opacity:0.8;
  }
  .ornament .line{height:1px; width:44px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .ornament svg{width:16px; height:16px;}

  .stage{
    padding:0 26px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .stage.left{align-items:stretch; text-align:right;}

  h1.title{
    font-size:26px; font-weight:600; margin:4px 0 6px; color:var(--ivory);
    line-height:1.4;
  }
  p.sub{
    color:var(--ivory-dim); font-size:15.5px; line-height:1.9; margin:0 0 22px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 20px;
    width:100%;
    box-shadow:0 18px 40px -20px rgba(0,0,0,0.6);
  }

  input[type=text], input[type=password], textarea, select{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--ivory);
    font-family:'Noto Serif Bengali', serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:3px;
    margin-bottom:14px;
    outline:none;
    text-align:right;
  }
  textarea{resize:vertical; min-height:90px; text-align:right;}
  input::placeholder, textarea::placeholder{color:#7d7864;}
  input:focus, textarea:focus, select:focus{border-color:var(--gold);}
  label.field-label{
    display:block; font-size:13px; color:var(--gold-soft); margin-bottom:6px; text-align:right;
  }

  .btn{
    display:inline-block;
    width:100%;
    background:linear-gradient(180deg, #d4b878, var(--gold));
    color:#1a1305;
    border:none;
    border-radius:3px;
    padding:13px 18px;
    font-size:16px;
    font-weight:600;
    font-family:'Noto Serif Bengali', serif;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 10px 24px -10px rgba(201,166,98,0.6);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{
    background:transparent; color:var(--ivory); border:1px solid var(--line);
    font-weight:500;
  }
  .btn.ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn.rose{background:linear-gradient(180deg,#b96068,var(--rose)); color:#fff0ee;}

  .row2{display:flex; gap:12px; margin-top:6px;}
  .row2 .btn{flex:1;}

  .errmsg{color:#e0a0a0; font-size:13.5px; margin:-6px 0 12px; text-align:right;}

  /* Dashboard grid */
  .hero{
    padding:30px 22px 10px; text-align:center;
  }
  .hero .greet{font-size:13px; color:var(--gold); letter-spacing:0.14em;}
  .hero h1{font-size:28px; margin:8px 0 4px;}
  .hero p{color:var(--ivory-dim); font-size:14.5px; margin:0;}

  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    padding:18px 20px 10px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .tile:hover{border-color:var(--gold); transform:translateY(-2px);}
  .tile .icon{font-size:24px; margin-bottom:8px; display:block;}
  .tile .label{font-size:14.5px; color:var(--ivory); line-height:1.4;}

  .section-title{
    font-size:20px; color:var(--gold); margin:6px 0 18px; text-align:center; font-weight:600;
  }
  .section-title small{display:block; font-size:12px; color:var(--ivory-dim); margin-top:4px; font-weight:400;}

  .letter-box{
    background:var(--panel);
    border:1.5px dashed var(--line);
    padding:26px 22px;
    border-radius:4px;
    text-align:right;
    line-height:2.15;
    font-size:16px;
    white-space:pre-line;
  }
  .letter-box .addr{color:var(--gold); font-size:18px; margin-bottom:14px; display:block;}
  .letter-box .sign{color:var(--gold-soft); margin-top:16px; display:block; font-style:italic;}

  .tip-item, .hadith-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-right:3px solid var(--gold);
    padding:16px 18px;
    border-radius:3px;
    margin-bottom:12px;
    text-align:right;
    font-size:15px;
    line-height:1.85;
  }
  .hadith-item .ref{display:block; color:var(--gold-soft); font-size:12.5px; margin-top:8px;}

  .photo-frame{
    border:6px solid var(--panel);
    outline:1.5px dashed var(--line);
    border-radius:4px;
    overflow:hidden;
    margin:0 0 18px;
  }
  .photo-frame img{width:100%; display:block;}
  .caption{color:var(--ivory-dim); font-size:14px; text-align:center; margin:0 0 26px; font-style:italic;}

  .memory-entry{
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:12px 16px; margin-bottom:10px; text-align:right; font-size:14.5px;
  }
  .memory-entry .who{color:var(--gold); font-size:12px; display:block; margin-bottom:4px;}

  /* chat */
  .chat-wrap{
    display:flex; flex-direction:column; height:62vh; min-height:420px;
    border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--panel);
  }
  .chat-log{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
  .bubble{
    max-width:78%; padding:10px 14px; border-radius:12px; font-size:14.5px; line-height:1.7;
  }
  .bubble.me{align-self:flex-end; background:linear-gradient(180deg,#d4b878,var(--gold)); color:#1a1305; border-bottom-right-radius:3px;}
  .bubble.them{align-self:flex-start; background:var(--panel-soft); color:var(--ivory); border:1px solid var(--line); border-bottom-left-radius:3px;}
  .bubble .meta{display:block; font-size:10.5px; opacity:0.65; margin-top:4px;}
  .chat-input{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);}
  .chat-input input{margin:0; flex:1; text-align:right;}
  .chat-input button{
    background:var(--gold); border:none; color:#1a1305; border-radius:3px; padding:0 16px; cursor:pointer; font-family:'Noto Serif Bengali',serif; font-weight:600;
  }

  /* love meter */
  .meter-wrap{width:100%; margin:10px 0 26px;}
  .heart-scale{font-size:30px; letter-spacing:6px; margin-bottom:10px;}
  input[type=range]{width:100%; accent-color:var(--gold); margin:8px 0 4px;}
  .meter-label{color:var(--ivory-dim); font-size:14px;}

  /* routine */
  .routine-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .routine-grid .full{grid-column:1 / -1;}
  .routine-log{margin-top:22px;}
  .routine-card{
    background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-bottom:10px;
  }
  .routine-card .date{color:var(--gold); font-size:13px; margin-bottom:8px; display:block; text-align:right;}
  .routine-card .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; color:var(--ivory-dim); flex-direction:row-reverse;}
  .routine-card .kv b{color:var(--ivory); font-weight:500;}

  .whatsapp-reveal{
    text-align:center; padding:30px 20px;
  }
  .whatsapp-reveal .num{font-size:24px; color:var(--gold); letter-spacing:0.06em; margin:14px 0 22px; font-family:'Cormorant Garamond', serif; font-weight:600;}

  .hero-landing{
    padding:52px 24px 12px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
    position:relative;
  }
  .hero-landing::before{
    content:""; position:absolute; width:210px; height:210px; top:34px;
    border-radius:50%; border:1px solid rgba(209,151,74,.08);
    box-shadow:0 0 70px rgba(209,151,74,.06), inset 0 0 50px rgba(164,56,74,.04);
    pointer-events:none;
  }
  .hero-eyebrow{
    font-size:11.5px; color:var(--ivory-dim); letter-spacing:0.24em; margin-bottom:26px;
    opacity:0.82; text-transform:uppercase; position:relative;
  }
  .monogram{
    display:flex; align-items:center; justify-content:center; gap:16px;
    font-family:'Cormorant Garamond', serif;
    font-size:48px; line-height:1; color:var(--gold); font-weight:600;
    letter-spacing:.02em; position:relative;
    text-shadow:0 0 36px rgba(209,151,74,0.22);
  }
  .monogram-name{display:inline-block; animation:monogramFloat 4s ease-in-out infinite;}
  .monogram-name:last-child{animation-delay:-2s;}
  .monogram-joiner{
    font-size:20px; color:var(--ivory-dim); font-family:'Cormorant Garamond', serif;
    transform:translateY(-1px); opacity:.8;
  }
  @keyframes monogramFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
  }
  .hero-rule{
    width:1px; height:38px; background:linear-gradient(180deg, var(--gold), transparent);
    margin:24px 0 18px;
  }
  .hero-tagline{
    color:var(--ivory-dim); font-size:15.5px; line-height:2;
    max-width:335px; margin:0 0 8px;
  }
  .made-for{
    margin-top:10px; color:var(--gold-soft); font-family:'Cormorant Garamond',serif;
    font-size:13px; letter-spacing:.12em; opacity:.9;
  }
  .access-card{
    margin-top:18px; position:relative; overflow:hidden;
    border-radius:14px; padding:24px 20px 20px;
    background:linear-gradient(145deg, rgba(44,32,68,.96), rgba(25,17,40,.98));
    box-shadow:0 22px 55px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
  }
  .access-card::after{
    content:""; position:absolute; width:130px; height:130px; right:-65px; top:-65px;
    border-radius:50%; border:1px solid rgba(209,151,74,.12);
  }
  .access-label{
    text-align:left; font-size:11px; color:var(--gold); letter-spacing:.22em;
    margin-bottom:18px; text-transform:uppercase; font-family:'Cormorant Garamond',serif;
  }
  .login-field{position:relative; margin-bottom:14px;}
  .login-field .field-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--gold-soft); pointer-events:none; opacity:.8;
    transition:color .2s ease, transform .2s ease, opacity .2s ease;
  }
  .login-field:focus-within .field-icon{
    color:var(--gold); opacity:1; transform:translateY(-50%) scale(1.08);
  }
  .login-field input{
    margin:0; padding:14px 44px 14px 46px; border-radius:9px;
    text-align:left; background:rgba(14,10,24,.72);
    border-color:rgba(209,151,74,.22);
  }
  .login-field input::placeholder{color:#81788f;}
  .password-toggle{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border:0; background:transparent; color:var(--ivory-dim);
    cursor:pointer; display:grid; place-items:center; border-radius:50%;
  }
  .password-toggle:hover{color:var(--gold); background:rgba(209,151,74,.08);}
  .password-toggle svg{width:17px;height:17px;}
  .login-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:8px; border-radius:9px; padding:14px 18px;
    font-family:'Cormorant Garamond',serif; font-size:18px; letter-spacing:.12em;
    text-transform:uppercase;
  }
  .login-btn svg{width:18px;height:18px; transition:transform .25s ease;}
  .login-btn:hover svg{transform:translateX(3px);}
  .hero-footnote{
    color:var(--ivory-dim); font-size:12px; opacity:0.58; margin-top:16px;
  }
  .hero-footnote strong{color:var(--gold-soft); font-weight:500;}

  /* Premium dynamic dashboard icons */
  .tile .icon{
    width:46px; height:46px; margin:0 auto 10px; display:grid; place-items:center;
    border:1px solid rgba(209,151,74,.18); border-radius:50%;
    background:radial-gradient(circle, rgba(209,151,74,.12), transparent 68%);
    color:var(--gold); transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .tile .icon svg{width:22px;height:22px;stroke:currentColor;transition:transform .35s ease;}
  .tile:hover .icon{
    transform:translateY(-3px) scale(1.06); border-color:rgba(209,151,74,.5);
    box-shadow:0 8px 22px rgba(209,151,74,.12);
  }
  .tile:hover .icon svg{transform:rotate(-8deg) scale(1.08);}
  .tile[data-go="chat"]:hover .icon svg{animation:chatBounce .7s ease-in-out infinite;}
  .tile[data-go="letter"]:hover .icon svg{animation:heartBeat .8s ease-in-out infinite;}
  .tile[data-go="contact"]:hover .icon svg{animation:ring .65s ease-in-out infinite;}
  @keyframes heartBeat{0%,100%{transform:scale(1)}35%{transform:scale(1.18)}55%{transform:scale(.96)}}
  @keyframes chatBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(10deg)}75%{transform:rotate(-10deg)}}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--gold); color:var(--ivory);
    padding:10px 20px; border-radius:999px; font-size:13.5px; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .toast.show{opacity:1;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>
</head>

<script type="module">

const LETTER_TEXT = `প্রিয়তমা ঈশিতা,

কীভাবে শুরু করবো জানি না, তোমাকে নিয়ে বলার মতো কথা এত বেশি যে গুছিয়ে উঠতে পারছি না।

তোমার নামটা মনে পড়লেই বুকের ভেতর এক অন্যরকম শান্তি নেমে আসে। মনে হয় এই একটা নামের মধ্যেই আমার পুরো ভবিষ্যৎ লুকিয়ে আছে।

তোমার চোখ দুটোয় আমি হাজারটা না-বলা কথা পড়ে ফেলি। তোমার হাসিটা আমার দিনের সবচেয়ে দামি জিনিস, যত ক্লান্তি থাকুক না কেন, সব ভুলিয়ে দেয়।

তোমার অভিমান, তোমার রাগ — এগুলোও আমার কাছে অন্যরকম ভালো লাগে। খুঁত না খুঁজে সবটুকু ভালোবাসাই বোধহয় আসল ভালোবাসা।

আমরা এখনো কাছাকাছি নেই, সামনাসামনি কথাও হয় না, তবু এই দূরত্ব আমাদের বাঁধনটাকে দুর্বল করতে পারেনি। বরং প্রমাণ করেছে আমাদের সম্পর্কটা কতটা গভীর।

আল্লাহর কাছে হাজারবার শুকরিয়া, তিনি তোমাকে আমার জীবনে পাঠিয়েছেন। তুমি শুধু আমার হবু বউ না, তুমি আমার দোয়ার ফসল।

তোমাকে নিয়েই গড়তে চাই একটা সুন্দর, পবিত্র সংসার — বিশ্বাস, যত্ন আর ভালোবাসায় ভরা।

অনেক অনেক ভালোবাসি তোমাকে, ঈশিতা। ইনশাআল্লাহ শীঘ্রই এই দূরত্ব ঘুচে যাবে।`;

const TIPS = [
 "রাগ উঠলেই আগে ১০ সেকেন্ড চোখ বন্ধ করে বান্নার হাসিমুখটা কল্পনা করবে, দেখবে রাগ অর্ধেক কমে যাবে।",
 "রাগের সময় সরাসরি কিছু বলার আগে একগ্লাস ঠান্ডা পানি খাবে — মাথা ঠান্ডা থাকলে সম্পর্কও ঠান্ডা থাকে।",

async function loadShared(key, fallback){
  try{
    const ref = doc(db, 'shared', key);
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().value) return JSON.parse(snap.data().value);
    return fallback;
  }catch(e){ console.error('firestore load error', e); return fallback; }
}
async function saveShared(key, value){
  try{
    const ref = doc(db, 'shared', key);
    await setDoc(ref, { value: JSON.stringify(value), updatedAt: Date.now() });
  }catch(e){ console.error('firestore save error', e); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---------------- render dispatcher ---------------- */
let contactRevealed = false;
let chatPollTimer = null;

async function render(){
  const app = document.getElementById('app');
  if(chatPollTimer && SCREEN !== 'chat'){ clearInterval(chatPollTimer); chatPollTimer = null; }

  switch(SCREEN){
    case 'login': app.innerHTML = screenLogin(); attachLogin(); break;
    case 'consent': app.innerHTML = screenConsent(); attachConsent(); break;
    case 'noTease': app.innerHTML = screenNoTeaseSub(); attachNoTease(); break;
    case 'lovemeter': app.innerHTML = screenLoveMeter(); attachLoveMeter(); break;
    case 'letterask': app.innerHTML = screenLetterAsk(); attachLetterAsk(); break;
    case 'letter': app.innerHTML = screenLetter(); attachBackDash(); break;
    case 'dashboard': app.innerHTML = screenDashboard(); attachDashboard(); break;
    case 'tips': app.innerHTML = screenTips(); attachBackDash(); break;
    case 'contact': app.innerHTML = screenContactAsk(contactRevealed); attachContact(); break;
    case 'hadith': app.innerHTML = screenHadith(); attachBackDash(); break;
    case 'corner': app.innerHTML = await screenCorner(); attachCorner(); break;
    case 'worry': app.innerHTML = screenWorry(); attachWorry(); break;
    case 'chat': app.innerHTML = screenChat(); attachChat(); break;
    case 'routine': app.innerHTML = screenRoutine(); attachRoutine(); break;
  }
}

function attachBackDash(){
  const b = document.getElementById('btn-back-dash');
  if(b) b.onclick = ()=>go('dashboard');
}

function attachLogin(){
  const user = document.getElementById('in-user');
  const pass = document.getElementById('in-pass');

  const login = ()=>{
    const u = user.value.trim().toLowerCase();
    const p = pass.value.trim().toLowerCase();
    const key = u + '|' + p;
    if(CREDENTIALS[key]){
      ROLE = CREDENTIALS[key];
      document.getElementById('login-err').classList.add('hidden');
      if(ROLE === 'esita'){ go('consent'); }
      else { go('dashboard'); }
    } else {
      document.getElementById('login-err').classList.remove('hidden');
    }
  };

  document.getElementById('btn-login').onclick = login;
  [user,pass].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter') login(); }));

  const toggle = document.getElementById('toggle-pass');
  toggle.onclick = ()=>{
    const hidden = pass.type === 'password';
    pass.type = hidden ? 'text' : 'password';
    toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    toggle.innerHTML = hidden
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3l18 18"></path><path d="M10.6 6.2A10.6 10.6 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.1 6.2C3.8 8.1 2.5 12 2.5 12s3.5 6 9.5 6c1 0 1.9-.2 2.8-.5"></path></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path><circle cx="12" cy="12" r="2.4"></circle></svg>`;
  };
}

function attachConsent(){
  document.getElementById('btn-yes').onclick = ()=>go('lovemeter');
  document.getElementById('btn-no').onclick = ()=>go('noTease');
}
function attachNoTease(){
  document.getElementById('btn-rethink').onclick = ()=>go('consent');
}
function attachLoveMeter(){
  const range = document.getElementById('love-range');
  const disp = document.getElementById('heart-display');
  const label = document.getElementById('meter-label');
  const update = (v)=>{
    const hearts = Math.round(v/20);
    disp.textContent = '❤️'.repeat(hearts) + '🤍'.repeat(5-hearts);
    label.textContent = v + '%';
  };
  range.oninput = (e)=>{ LOVEMETER_VAL = +e.target.value; update(LOVEMETER_VAL); };
  update(LOVEMETER_VAL);
  document.getElementById('btn-meter-next').onclick = ()=>go('letterask');
}
function attachLetterAsk(){
  document.getElementById('btn-letter-yes').onclick = ()=>go('letter');
  document.getElementById('btn-letter-no').onclick = ()=>go('dashboard');
}
function attachDashboard(){
  document.querySelectorAll('.tile').forEach(t=>{
    const open = ()=>{
      if(t.dataset.go === 'contact') contactRevealed = false;
      go(t.dataset.go);
    };
    t.onclick = open;
    t.onkeydown = e=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); open(); } };
  });
}
function attachContact(){
  const yesBtn = document.getElementById('btn-contact-yes');
  if(yesBtn){ yesBtn.onclick = ()=>{ contactRevealed = true; render(); }; }
  attachBackDash();
}

async function attachCorner(){
  attachBackDash();
  document.getElementById('btn-memory-add').onclick = async ()=>{
    const ta = document.getElementById('memory-input');
    const text = ta.value.trim();
    if(!text) return;
    const entries = await loadShared('memory:entries', []);
    entries.push({ who: ROLE==='esita' ? 'ঈশিতা' : 'বান্না', text, ts: Date.now() });
    await saveShared('memory:entries', entries);
    ta.value = '';
    showToast('স্মৃতি যোগ হয়েছে');
    app_refresh_corner(entries);
  };
}
function app_refresh_corner(entries){
  const list = document.getElementById('memory-list');
  if(!list) return;
  list.innerHTML = entries.length===0 ? '<p class="sub" style="text-align:center;">এখনো কোনো স্মৃতি লেখা হয়নি।</p>' :
    entries.slice().reverse().map(m=>`<div class="memory-entry"><span class="who">${m.who}</span>${escapeHtml(m.text)}</div>`).join('');
}

function attachWorry(){
  attachBackDash();
  if(ROLE === 'esita'){
    document.getElementById('btn-worry-send').onclick = async ()=>{
      const ta = document.getElementById('worry-input');
      const text = ta.value.trim();
      if(!text) return;
      const entries = await loadShared('worry:entries', []);
      entries.push({ text, ts: Date.now() });
      await saveShared('worry:entries', entries);
      ta.value = '';
      showToast('তোমার কথা বান্নার কাছে পৌঁছে গেছে');
    };
  } else {
    (async ()=>{
      const entries = await loadShared('worry:entries', []);
      const list = document.getElementById('worry-list');
      list.innerHTML = entries.length===0 ? '<p class="sub" style="text-align:center;">এখনো কিছু লেখেনি।</p>' :
        entries.slice().reverse().map(e=>`<div class="tip-item">${escapeHtml(e.text)}<span class="ref" style="display:block; margin-top:8px; color:#a98d52; font-size:12px;">${new Date(e.ts).toLocaleString('bn-BD')}</span></div>`).join('');
    })();
  }
}

async function refreshChat(){
  const log = document.getElementById('chat-log');
  if(!log) return;
  const messages = await loadShared('chat:messages', []);
  log.innerHTML = messages.map(m=>{
    const mine = m.who === ROLE;
    return `<div class="bubble ${mine?'me':'them'}">${escapeHtml(m.text)}<span class="meta">${m.who==='esita'?'ঈশিতা':'বান্না'} · ${new Date(m.ts).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
  }).join('');
  log.scrollTop = log.scrollHeight;
}
function attachChat(){
  attachBackDash();
  refreshChat();
  chatPollTimer = setInterval(refreshChat, 4000);
  const send = async ()=>{
    const input = document.getElementById('chat-text');
    const text = input.value.trim();
    if(!text) return;
    const messages = await loadShared('chat:messages', []);
    messages.push({ who: ROLE, text, ts: Date.now() });
    await saveShared('chat:messages', messages);
    input.value = '';
    refreshChat();
  };
  document.getElementById('btn-chat-send').onclick = send;
  document.getElementById('chat-text').addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
async function refreshRoutineList(){
  const list = document.getElementById('routine-list');
  if(!list) return;
  const log = await loadShared('routine:log', []);
  list.innerHTML = log.length===0 ? '<p class="sub" style="text-align:center;">এখনো কোনো এন্ট্রি নেই।</p>' :
    log.slice().reverse().slice(0,10).map(r=>`
      <div class="routine-card">
        <span class="date">${r.who==='esita'?'ঈশিতা':'বান্না'} · ${r.date}</span>
        <div class="kv"><span>ঘুম থেকে উঠা</span><b>${r.wake||'-'}</b></div>
        <div class="kv"><span>ঘুমাতে যাওয়া</span><b>${r.sleep||'-'}</b></div>
        <div class="kv"><span>নামাজ</span><b>${r.prayer} ওয়াক্ত</b></div>
        <div class="kv"><span>Facebook</span><b>${r.fb||0} ঘন্টা</b></div>
        <div class="kv"><span>YouTube</span><b>${r.yt||0} ঘন্টা</b></div>
        <div class="kv"><span>মোবাইল</span><b>${r.mobile||0} ঘন্টা</b></div>
        <div class="kv"><span>পড়ালেখা</span><b>${r.study||0} ঘন্টা</b></div>
        ${r.note?`<div class="kv"><span>নোট</span><b>${escapeHtml(r.note)}</b></div>`:''}
      </div>`).join('');
}
function attachRoutine(){
  attachBackDash();
  refreshRoutineList();
  document.getElementById('btn-routine-save').onclick = async ()=>{
    const entry = {
      who: ROLE, date: todayStr(),
      wake: document.getElementById('r-wake').value,
      sleep: document.getElementById('r-sleep').value,
      prayer: document.getElementById('r-prayer').value,
      fb: document.getElementById('r-fb').value,
      yt: document.getElementById('r-yt').value,
      mobile: document.getElementById('r-mobile').value,
      study: document.getElementById('r-study').value,
      note: document.getElementById('r-note').value.trim(),
      ts: Date.now()
    };
    const log = await loadShared('routine:log', []);
    log.push(entry);
    await saveShared('routine:log', log);
    showToast('আজকের এন্ট্রি সেভ হয়েছে');
    refreshRoutineList();
  };
}

render();
</script>
</body>
</html>
